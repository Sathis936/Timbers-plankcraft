<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Timber &amp; Plank Craft Studio</title>
  <meta name="description" content="Sign in to your Timber &amp; Plank account to manage on-site laser measurements, wood sample boxes, and architectural floor schedules.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="alternate icon" href="favicon.svg">
  
  <!-- Immediate Theme & Direction Init (Prevents FOUC) -->
  <script>
    (function() {
      const theme = localStorage.getItem('timber_plank_theme');
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
        document.documentElement.setAttribute('data-theme', 'dark');
      }
      const dir = localStorage.getItem('timber_plank_direction');
      if (dir === 'rtl') {
        document.documentElement.setAttribute('dir', 'rtl');
        document.documentElement.classList.add('rtl-mode');
      }
    })();
  </script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts & Custom Showroom CSS -->
  <link rel="stylesheet" href="assets/css/styles.css?v=20261007">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            wood: {
              dark: '#1b130e',
              charcoal: '#120e0b',
              walnut: '#2c1d16',
              espresso: '#3d281e',
              pecan: '#5a3a29',
              amber: '#c58940',
              oak: '#d4a373',
              honey: '#e9c46a',
              bone: '#f7f3ed',
              cream: '#faf7f2',
              parchment: '#f0e8dc'
            }
          }
        }
      }
    }
  </script>
  <style>
    html, body {
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }
    @media (min-height: 580px) {
      html, body {
        overflow: hidden;
      }
    }
    @media (max-height: 579px) {
      html, body {
        overflow-y: auto;
      }
    }
    html[dir="rtl"] .auth-floating-controls {
      right: auto !important;
      left: 1rem !important;
    }
  </style>
</head>
<body class="wood-texture-subtle min-h-screen w-full antialiased selection:bg-[#c58940] selection:text-white m-0 p-0 flex flex-col justify-center items-center">

  <!-- Floating Controls Alone: Theme Toggle & RTL Toggle -->
  <aside class="auth-floating-controls fixed top-3.5 right-3.5 sm:top-4 sm:right-4 z-50 flex items-center gap-2" aria-label="Appearance controls">
    <!-- Theme Toggle Button -->
    <button type="button" class="theme-toggle-btn p-2 sm:p-2.5 rounded-xl border border-[#e3d7c5] dark:border-[#38271e] hover:border-[#c58940] bg-white/95 dark:bg-[#1f1712]/95 backdrop-blur-md text-[#2c1d16] dark:text-[#f7f3ed] transition hover-lift flex items-center justify-center shadow-lg" title="Toggle Dark / Light Theme" aria-label="Toggle Theme">
      <svg class="theme-icon-moon w-4 h-4 text-[#5a3a29] dark:text-[#dfd3c5]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
      </svg>
      <svg class="theme-icon-sun hidden w-4 h-4 text-[#e9c46a]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
      </svg>
    </button>

    <!-- RTL Toggle Button -->
    <button type="button" class="rtl-toggle-btn px-2.5 py-1.5 sm:px-3 sm:py-2 rounded-xl border border-[#e3d7c5] dark:border-[#38271e] hover:border-[#c58940] bg-white/95 dark:bg-[#1f1712]/95 backdrop-blur-md text-[#5a3a29] dark:text-[#dfd3c5] font-bold text-xs tracking-wider transition hover-lift shadow-lg flex items-center justify-center" title="Toggle RTL / LTR Layout" aria-label="Toggle Direction">
      <span class="rtl-btn-text">RTL</span>
    </button>
  </aside>

  <!-- Login Central Container (Fixed, Non-scrolling, Perfectly Centered) -->
  <main class="w-full flex-1 flex items-center justify-center p-3 sm:p-5 bg-[#1b130e] text-[#f7f3ed] relative overflow-hidden transition-colors">
    <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1920&q=80" 
         alt="Luxury timber architecture and craftsmanship showroom" 
         class="absolute inset-0 w-full h-full object-cover opacity-20 pointer-events-none">
    <div class="absolute inset-0 bg-gradient-to-b from-[#120e0b]/90 via-[#1b130e]/85 to-[#120e0b]/95 pointer-events-none"></div>

    <div class="w-full max-w-[410px] bg-white dark:bg-[#1f1712] border border-[#e3d7c5] dark:border-[#38271e] rounded-3xl shadow-2xl relative overflow-hidden transition-all duration-300">
      
      <!-- Decorative Warm Accent Top Line (Contained within rounded card) -->
      <div class="w-full h-1.5 bg-gradient-to-r from-[#c58940] via-[#e9c46a] to-[#c58940]"></div>

      <div class="px-5 sm:px-7 pt-4 pb-5">
        <!-- Brand Logo Header -->
        <div class="text-center mb-4">
          <a href="index.html" class="inline-flex flex-col items-center group" title="Return to Timber & Plank Showroom">
            <div class="w-10 h-10 bg-gradient-to-br from-[#2c1d16] to-[#120e0b] border border-[#c58940]/50 rounded-2xl flex items-center justify-center shadow-md group-hover:border-[#c58940] transition mb-1.5">
              <svg class="w-5 h-5 text-[#d4a373]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 7.5L12 3l9 4.5-9 4.5-9-4.5z" fill="rgba(197, 137, 64, 0.22)"/>
                <path d="M3 12l9 4.5 9-4.5"/>
                <path d="M3 16.5l9 4.5 9-4.5"/>
              </svg>
            </div>
            <span class="font-serif text-base sm:text-lg font-bold tracking-wider text-[#c58940] leading-none">TIMBER &amp; PLANK</span>
            <span class="text-[8px] tracking-[0.2em] text-[#c58940]/80 uppercase font-semibold mt-0.5">CRAFT STUDIO &amp; SHOWROOM</span>
          </a>

          <h1 class="font-serif text-xl sm:text-2xl font-bold text-[#2c1d16] dark:text-[#f7f3ed] mt-2 mb-0.5">Sign In</h1>
        </div>

        <!-- Sign In Form View -->
        <div id="login-form-view">
          <!-- Logged-in Active State Banner (No redirect) -->
          <div id="auth-status-banner" class="hidden mb-3.5 p-2.5 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-[#2c1d16] dark:text-[#f7f3ed] transition">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2 min-w-0">
                <div class="w-6 h-6 rounded-lg bg-emerald-500/20 text-emerald-600 dark:text-emerald-400 flex items-center justify-center flex-shrink-0">
                  <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                </div>
                 
              </div>
              <button type="button" id="sign-out-btn" class="px-2 py-0.5 rounded-lg border border-[#e3d7c5] dark:border-[#38271e] hover:border-red-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 bg-white dark:bg-[#281c15] text-[10px] font-semibold text-[#5a3a29] dark:text-[#dfd3c5] transition flex-shrink-0 shadow-sm">
                Sign Out
              </button>
            </div>
          </div>

          <form id="login-form" class="space-y-3">
            <div>
              <label for="login-email" class="block text-[11px] font-semibold uppercase tracking-wider text-[#5a3a29] dark:text-[#dfd3c5] mb-1">
                Email Address
              </label>
              <div class="relative">
                <input type="email" id="login-email" required
                  value="client@timberplank.com"
                  placeholder="architect@domain.com"
                  class="w-full px-3.5 py-2 rounded-xl border border-[#e3d7c5] dark:border-[#38271e] focus:border-[#c58940] focus:ring-2 focus:ring-[#c58940]/20 text-sm text-[#2c1d16] dark:text-[#f7f3ed] bg-[#faf7f2] dark:bg-[#281c15] transition outline-none">
                <svg class="w-4 h-4 text-[#8c786a] absolute right-3.5 top-2.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206"></path>
                </svg>
              </div>
            </div>

            <div>
              <div class="flex items-center justify-between mb-1">
                <label for="login-password" class="block text-[11px] font-semibold uppercase tracking-wider text-[#5a3a29] dark:text-[#dfd3c5]">
                  Password
                </label>
                <a href="#" onclick="showToast('Password reset link has been dispatched to your email.', 'info'); return false;" class="text-xs text-[#c58940] hover:underline">Forgot?</a>
              </div>
              <div class="relative">
                <input type="password" id="login-password" required
                  value="timbercraft2026"
                  placeholder="••••••••"
                  class="w-full px-3.5 py-2 rounded-xl border border-[#e3d7c5] dark:border-[#38271e] focus:border-[#c58940] focus:ring-2 focus:ring-[#c58940]/20 text-sm text-[#2c1d16] dark:text-[#f7f3ed] bg-[#faf7f2] dark:bg-[#281c15] transition outline-none">
                <svg class="w-4 h-4 text-[#8c786a] absolute right-3.5 top-2.5 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
              </div>
            </div>

            <div class="flex items-center justify-between text-xs text-[#5a3a29] dark:text-[#dfd3c5] pt-0.5">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" checked class="w-3.5 h-3.5 rounded border-[#e3d7c5] text-[#c58940] focus:ring-[#c58940]">
                <span class="text-xs">Keep me signed in</span>
              </label>
              <span class="text-[#8c786a] dark:text-[#b09e90] text-[11px]">SSL 256-bit Encrypted</span>
            </div>

            <!-- Submit Button -->
            <button type="submit"
              class="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-[#c58940] to-[#b37833] hover:from-[#b37833] hover:to-[#966324] text-white font-semibold text-sm tracking-wide shadow-md hover:shadow-lg transition hover-lift flex items-center justify-center gap-2">
              <span>Login</span>
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
              </svg>
            </button>

            <!-- Instant 1-Click Demo Login -->
            <button type="button" id="demo-login-btn"
              class="w-full py-2 px-4 rounded-xl border border-[#c58940]/40 hover:border-[#c58940] bg-[#c58940]/5 hover:bg-[#c58940]/10 text-[#c58940] font-semibold text-xs tracking-wider uppercase transition flex items-center justify-center gap-1.5">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
              </svg>
              <span>1-Click Instant Demo Login</span>
            </button>
          </form>

          <!-- Security Guarantee -->
          <div class="mt-3.5 pt-3 border-t border-[#e3d7c5] dark:border-[#38271e] text-center text-[10.5px] text-[#8c786a] dark:text-[#b09e90] space-y-0.5">
            <p>National Wood Flooring Association (NWFA) Accredited Studio</p>
            <p>Need trade onboarding? Contact <span class="text-[#c58940] font-medium">+91 98765 43210</span></p>
          </div>
        </div>
      </div>

    </div>
  </main>

   

  <!-- Scripts -->
  <script src="assets/js/main.js"></script>
  <script>
    // Handle Authentication without redirection, displaying toast messages
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('login-form');
      const demoBtn = document.getElementById('demo-login-btn');
      const statusBanner = document.getElementById('auth-status-banner');
      const currentUserEmail = document.getElementById('current-user-email');
      const signOutBtn = document.getElementById('sign-out-btn');
      const emailInput = document.getElementById('login-email');
      const passInput = document.getElementById('login-password');

      function updateSessionUI() {
        if (!statusBanner || !currentUserEmail) return;
        const loggedIn = AuthManager.isLoggedIn();
        if (loggedIn) {
          const userEmail = AuthManager.getUserEmail();
          currentUserEmail.textContent = userEmail;
          statusBanner.classList.remove('hidden');
          if (emailInput && !emailInput.value) {
            emailInput.value = userEmail;
          }
        } else {
          statusBanner.classList.add('hidden');
        }
      }

      function performLogin(email) {
        AuthManager.login(email);
        updateSessionUI();
        showToast('Signed in successfully! Welcome back to Timber & Plank.', 'success');
        setTimeout(() => {
          showToast(`Active showroom session verified for ${email}.`, 'info');
        }, 500);
      }

      if (loginForm) {
        loginForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const email = emailInput ? emailInput.value.trim() : '';
          const pass = passInput ? passInput.value.trim() : '';
          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

          if (!email || !emailRegex.test(email)) {
            showToast('Please enter a valid email address.', 'warning');
            if (emailInput) emailInput.focus();
            return;
          }

          if (!pass) {
            showToast('Please enter your account password.', 'warning');
            if (passInput) passInput.focus();
            return;
          }

          performLogin(email);
        });
      }

      if (demoBtn) {
        demoBtn.addEventListener('click', (e) => {
          e.preventDefault();
          const demoEmail = 'client@timberplank.com';
          if (emailInput) emailInput.value = demoEmail;
          if (passInput) passInput.value = 'timbercraft2026';
          performLogin(demoEmail);
        });
      }

      if (signOutBtn) {
        signOutBtn.addEventListener('click', (e) => {
          e.preventDefault();
          AuthManager.logout();
          updateSessionUI();
          showToast('Signed out of your showroom account.', 'info');
        });
      }

      // Initial check on load (without redirecting)
      updateSessionUI();
    });
  </script>
</body>
</html>
